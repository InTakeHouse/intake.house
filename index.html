<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intake — Tus espacios físicos, virtualizados.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange-1:#f5871f;
    --orange-2:#f2a71b;
    --text-dark:#111111;
    --text-gray:#5b5b5b;
    --border:#e3e0da;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(247,178,90,0.18), transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 100%, rgba(247,178,90,0.10), transparent 60%),
      #fffefb;
    color:var(--text-dark);
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:90px 24px 60px;
    text-align:center;
  }
  .logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:56px;
  }
  .logo svg{ display:block; }
  .logo span{
    font-weight:800;
    font-size:34px;
    background:linear-gradient(90deg, var(--orange-1), var(--orange-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h1{
    font-size:64px;
    font-weight:800;
    line-height:1.08;
    margin:0 0 28px;
    letter-spacing:-1px;
  }
  h1 .accent{
    background:linear-gradient(90deg, var(--orange-1), var(--orange-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    font-size:22px;
    color:var(--text-gray);
    margin:0 0 40px;
    font-weight:400;
  }
  .desc{
    font-size:18px;
    color:var(--text-gray);
    line-height:1.6;
    max-width:560px;
    margin:0 auto 36px;
    font-weight:400;
  }
  form{
    display:flex;
    gap:12px;
    max-width:600px;
    margin:0 auto 14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  input[type=email]{
    flex:1 1 280px;
    padding:18px 22px;
    border-radius:14px;
    border:1.5px solid var(--border);
    max-height:60px;
    font-size:16px;
    font-family:'Poppins',sans-serif;
    outline:none;
    background:#fff;
  }
  input[type=email]:focus{
    border-color:var(--orange-2);
  }
  button{
    flex:0 0 auto;
    padding:18px 28px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg, var(--orange-1), var(--orange-2));
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:16px;
    max-height:60px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    transition:opacity .15s ease;
  }
  button:hover{ opacity:.92; }
  button:disabled{ opacity:.6; cursor:default; }
  .fine{
    font-size:14px;
    color:#8a8a8a;
    margin:0 0 48px;
  }
  .social{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .avatars{
    display:flex;
  }
  .avatars span{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:11px;
    font-weight:700;
    border:2px solid #fffefb;
    margin-left:-10px;
    background:linear-gradient(135deg, var(--orange-1), var(--orange-2));
  }
  .avatars span:first-child{ margin-left:0; }
  .stars{
    color:#f2b01e;
    font-size:16px;
    letter-spacing:1px;
  }
  .count{
    font-size:15px;
    color:#444;
  }
  .count strong{
    color:var(--text-dark);
    font-weight:700;
  }
  footer{
    text-align:center;
    padding:40px 24px 30px;
    font-size:14px;
    color:#9a9a9a;
  }
  .msg{
    max-width:600px;
    margin:0 auto 14px;
    font-size:15px;
    font-weight:500;
  }
  .msg.success{ color:#1a7a3c; }
  .msg.error{ color:#c0392b; }

  @media (max-width:600px){
    h1{ font-size:42px; }
    .sub{ font-size:18px; }
    .desc{ font-size:16px; }
    form{ flex-direction:column; }
    button{ width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 11L12 3L21 11" stroke="#f5871f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 10V20C5 20.5523 5.44772 21 6 21H18C18.5523 21 19 20.5523 19 20V10" stroke="#f5871f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="16" r="2" fill="#f5871f"/>
    </svg>
    <span>intake</span>
  </div>

  <h1>Tus espacios físicos,<br><span class="accent">virtualizados.</span></h1>

  <p class="sub">Explóralos desde cualquier lugar.</p>

  <p class="desc">InTake viene en camino. Súmate a la waitlist para ser el primero en saber cuándo esté disponible.</p>

  <div id="msg" class="msg" style="display:none;"></div>

  <form id="waitlist-form">
    <input type="email" id="email" name="email" placeholder="Tu correo de trabajo" required>
    <button type="submit" id="submit-btn">
      <span id="btn-text">Unirme a la waitlist</span>
      <span aria-hidden="true">→</span>
    </button>
  </form>

  <p class="fine">Sin tarjeta de crédito · Cancela cuando quieras</p>

  <div class="social">
    <div class="avatars">
      <span>SM</span><span>JT</span><span>PR</span><span>AK</span><span>LB</span>
    </div>
    <div class="stars">★★★★★</div>
    <div class="count"><strong id="waitlist-count">500+</strong> agentes ya en la waitlist</div>
  </div>

</div>

<footer>© 2026 intake.house</footer>

<script>
  // ---------------------------------------------------------------
  // FORMULARIO DE WAITLIST
  // Reemplaza FORM_ENDPOINT_AQUI por tu endpoint de Formspree
  // (ver instrucciones de publicación para obtenerlo gratis).
  // Mientras tanto, los correos quedan guardados localmente
  // en localStorage como respaldo.
  // ---------------------------------------------------------------
  const FORM_ENDPOINT = "https://formspree.io/f/xppaorgw"; // ej: "https://formspree.io/f/xxxxxxx"

  const form = document.getElementById('waitlist-form');
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const msg = document.getElementById('msg');

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
    msg.style.display = 'block';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if(!email) return;

    btn.disabled = true;
    btnText.textContent = 'Enviando...';

    // Respaldo local (siempre se guarda, incluso si el endpoint aún no está configurado)
    try{
      const stored = JSON.parse(localStorage.getItem('intake_waitlist') || '[]');
      if(!stored.includes(email)){
        stored.push(email);
        localStorage.setItem('intake_waitlist', JSON.stringify(stored));
      }
    }catch(err){}

    if(FORM_ENDPOINT === "FORM_ENDPOINT_AQUI"){
      // Endpoint aún no configurado: solo confirma visualmente
      setTimeout(function(){
        showMsg('¡Gracias! Te avisaremos apenas lancemos. (Configura tu endpoint para recibir los correos por email — ver instrucciones)', 'success');
        form.reset();
        btn.disabled = false;
        btnText.textContent = 'Unirme a la waitlist';
      }, 500);
      return;
    }

    try{
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });
      if(res.ok){
        showMsg('¡Gracias! Te avisaremos apenas lancemos.', 'success');
        form.reset();
      } else {
        showMsg('Hubo un problema al enviar. Intenta de nuevo.', 'error');
      }
    }catch(err){
      showMsg('Hubo un problema al enviar. Intenta de nuevo.', 'error');
    }finally{
      btn.disabled = false;
      btnText.textContent = 'Unirme a la waitlist';
    }
  });
</script>

</body>
</html>
